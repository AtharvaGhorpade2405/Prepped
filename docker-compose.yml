services:
  backend:
    image: ${DOCKERHUB_USERNAME}/prepped-backend:latest
    container_name: prepped-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - INTERVIEW_SIGNING_SECRET=${INTERVIEW_SIGNING_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - prepped-network

  websocket-server:
    image: ${DOCKERHUB_USERNAME}/prepped-websocket:latest
    container_name: prepped-websocket
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - INTERVIEW_SIGNING_SECRET=${INTERVIEW_SIGNING_SECRET}
    networks:
      - prepped-network

  frontend:
    image: ${DOCKERHUB_USERNAME}/prepped-frontend:latest
    container_name: prepped-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
      - websocket-server
    networks:
      - prepped-network

networks:
  prepped-network:
    driver: bridge

